<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Интерактивное тактическое руководство по игре Warpath: Ace Shooter. Основы, выбор фракции, трата золота, юниты, контры, офицеры и подготовка к сражениям.">
  <meta name="theme-color" content="#0d0e12">
  <title>WARPATH GUIDE — Тактическое руководство командира</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app-shell">
    <!-- Верхняя панель -->
    <header class="topbar">
      <a href="#page=2" class="brand" id="brand-home" aria-label="Warpath Guide — к содержанию">
        <span class="brand-badge" aria-hidden="true">W</span>
        <span class="brand-title">WARPATH <span class="brand-accent">GUIDE</span></span>
      </a>

      <div class="topbar-actions">
        <button type="button" class="icon-btn" id="btn-search" aria-label="Поиск по руководству" title="Поиск (/)">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="11" cy="11" r="8"></circle>
            <path d="m21 21-4.3-4.3"></path>
          </svg>
        </button>

        <button type="button" class="icon-btn" id="btn-theme" aria-label="Переключить тему оформления" title="Сменить тему">
          <svg class="icon-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="4"></circle>
            <path d="M12 2v2"></path><path d="M12 20v2"></path>
            <path d="m4.93 4.93 1.41 1.41"></path><path d="m17.66 17.66 1.41 1.41"></path>
            <path d="M2 12h2"></path><path d="M20 12h2"></path>
            <path d="m6.34 17.66-1.41 1.41"></path><path d="m19.07 4.93-1.41 1.41"></path>
          </svg>
          <svg class="icon-moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"></path>
          </svg>
        </button>

        <button type="button" class="icon-btn" id="btn-menu" aria-label="Открыть оглавление и прогресс" title="Оглавление">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <line x1="4" x2="20" y1="6" y2="6"></line>
            <line x1="4" x2="20" y1="12" y2="12"></line>
            <line x1="4" x2="20" y1="18" y2="18"></line>
          </svg>
        </button>
      </div>
    </header>

    <!-- Опция фильтрации страниц как на riseof.ru -->
    <div class="book-options">
      <label class="skip-toggle">
        <input type="checkbox" id="skip-subpages">
        <span class="skip-checkbox" aria-hidden="true"></span>
        <span>Пропускать доп. страницы глав</span>
      </label>
    </div>

    <!-- Основная область: Книга -->
    <main class="book-stage" id="book-stage">
      <div class="book-wrapper">
        <!-- Верхняя золотая закладка текущей главы -->
        <button type="button" class="chapter-bookmark" id="chapter-bookmark" title="Вернуться к содержанию">
          СОДЕРЖАНИЕ
        </button>

        <!-- Физический корпус книги с обрезом страниц -->
        <div class="book-frame">
          <div class="book-spine" aria-hidden="true"></div>

          <article class="book-page" id="book-page" aria-live="polite">
            <div class="page-scroll" id="page-content">
              <!-- Контент рендерится из js/app.js -->
            </div>
            <footer class="page-footer">
              <span class="page-num-line" aria-hidden="true"></span>
              <span class="page-num" id="page-num">2</span>
              <span class="page-num-line" aria-hidden="true"></span>
            </footer>
          </article>

          <div class="book-edges-right" aria-hidden="true"></div>
        </div>
      </div>

      <!-- Нижняя панель навигации -->
      <nav class="book-controls" aria-label="Навигация по страницам книги">
        <button type="button" class="ctrl-btn" id="btn-prev" aria-label="Предыдущая страница" title="Назад (←)">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="m15 18-6-6 6-6"></path>
          </svg>
        </button>

        <button type="button" class="page-counter" id="btn-toc-jump" title="Перейти к содержанию">
          <span id="counter-current">2</span>
          <span class="counter-sep">/</span>
          <span id="counter-total">26</span>
        </button>

        <button type="button" class="ctrl-btn" id="btn-next" aria-label="Следующая страница" title="Вперёд (→)">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="m9 18 6-6-6-6"></path>
          </svg>
        </button>

        <button type="button" class="ctrl-btn" id="btn-tts" aria-label="Озвучить страницу" aria-pressed="false" title="Озвучить текст страницы">
          <svg class="icon-vol" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
            <path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path>
            <path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path>
          </svg>
        </button>

        <button type="button" class="ctrl-btn" id="btn-fullscreen" aria-label="Полноэкранный режим" aria-pressed="false" title="На весь экран">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M8 3H5a2 2 0 0 0-2 2v3"></path>
            <path d="M21 8V5a2 2 0 0 0-2-2h-3"></path>
            <path d="M3 16v3a2 2 0 0 0 2 2h3"></path>
            <path d="M16 21h3a2 2 0 0 0 2-2v-3"></path>
          </svg>
        </button>
      </nav>
    </main>
  </div>

  <!-- Модальное окно Поиска -->
  <dialog class="modal-dialog" id="search-dialog" closedby="any" aria-labelledby="search-dialog-title">
    <div class="modal-header">
      <h2 id="search-dialog-title">Поиск по руководству</h2>
      <form method="dialog">
        <button type="submit" class="modal-close" aria-label="Закрыть поиск">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <path d="M18 6 6 18"></path><path d="m6 6 12 12"></path>
          </svg>
        </button>
      </form>
    </div>
    <div class="modal-body">
      <search>
        <label class="sr-only" for="search-input">Поиск по главам, юнитам и офицерам</label>
        <input type="search" id="search-input" class="search-input" placeholder="Например: Джексон, золото, VIP, SH танк, Arms Race..." autocomplete="off">
      </search>
      <div class="search-results" id="search-results"></div>
    </div>
  </dialog>

  <!-- Модальное окно Оглавления и прогресса -->
  <dialog class="modal-dialog" id="menu-dialog" closedby="any" aria-labelledby="menu-dialog-title">
    <div class="modal-header">
      <h2 id="menu-dialog-title">Навигация и прогресс</h2>
      <form method="dialog">
        <button type="submit" class="modal-close" aria-label="Закрыть меню">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <path d="M18 6 6 18"></path><path d="m6 6 12 12"></path>
          </svg>
        </button>
      </form>
    </div>
    <div class="modal-body">
      <div class="progress-card">
        <div class="progress-head">
          <span>Изучено глав</span>
          <strong id="progress-label">0 / 12 (0%)</strong>
        </div>
        <div class="progress-track">
          <div class="progress-fill" id="progress-fill" style="width: 0%"></div>
        </div>
      </div>
      <div class="drawer-toc" id="drawer-toc"></div>
      <div class="drawer-footer">
        <button type="button" class="btn-secondary" id="btn-reset-progress">Сбросить прогресс</button>
      </div>
    </div>
  </dialog>

  <script src="js/book-data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
